[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchlab-commons"
version = "0.2.0"
description = "Evidence-first verification and Patch Passports for software changes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Jordan García Morales"}
]
keywords = ["open-source", "security", "code-review", "github-actions", "ai-agents", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "actionlint-py==1.7.12.24",
  "bandit==1.9.4",
  "build==1.5.0",
  "coverage==7.15.2",
  "jsonschema==4.26.0",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "ruff==0.16.0",
  "shellcheck-py==0.11.0.1",
  "twine==6.2.0",
]

[project.urls]
Homepage = "https://github.com/xordanblu/patchlab-commons"
Documentation = "https://github.com/xordanblu/patchlab-commons/tree/main/docs"
Issues = "https://github.com/xordanblu/patchlab-commons/issues"
Source = "https://github.com/xordanblu/patchlab-commons"

[project.scripts]
patchlab = "patchlab_commons.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchlab_commons = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["patchlab_commons"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["examples/sample-passport", "examples/blocked-passport"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/action_entry.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/patchlab_commons", "scripts"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", "examples"]
