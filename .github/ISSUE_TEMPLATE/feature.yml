name: Feature proposal
description: Propose a focused capability or policy rule.
title: "[Proposal]: "
labels: [enhancement, design]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the maintainer problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Give real examples, measurements, or affected workflows.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: false_positive
    attributes:
      label: False-positive and compatibility risks
    validations:
      required: true
