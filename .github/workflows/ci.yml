name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: python -I -m pip install --no-deps -e .
      - name: Check installed dependencies
        run: python -I -m pip check
      - name: Compile
        run: python -I -m compileall -q src tests scripts
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test outside the repository
        run: >-
          python -I -c "import os, subprocess; os.chdir(os.environ['RUNNER_TEMP']);
          subprocess.run(['patchlab', '--version'], check=True);
          subprocess.run(['patchlab', 'schema', '--kind', 'report', '--output',
          'report.schema.json'], check=True)"

  quality:
    name: Static quality and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned direct development tools
        run: python -I -m pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: bandit -r src scripts -ll
      - run: actionlint -shellcheck="$(command -v shellcheck)"
      - run: shellcheck --version
      - run: pip-audit --requirement requirements-runtime.txt
      - run: python scripts/check_action_pins.py
      - run: python scripts/check_release.py
      - run: python -m json.tool docs/report.schema.json > /dev/null
      - run: python -m json.tool docs/passport.schema.json > /dev/null
      - run: git diff --check

  coverage:
    name: Branch and line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -I -m pip install coverage==7.15.2 -e .
      - run: coverage run --branch -m unittest discover -s tests -v
      - run: coverage report --show-missing --fail-under=90
      - run: coverage xml -o coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: Reproducible Python packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - run: python -I -m pip install -r requirements-release.txt
      - name: Build twice and compare bytes
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -I -m build --outdir dist-one
          rm -rf build src/*.egg-info
          python -I -m build --outdir dist-two
          test "$(find dist-one -maxdepth 1 -type f | wc -l)" = "$(find dist-two -maxdepth 1 -type f | wc -l)"
          for file in dist-one/*; do
            cmp "$file" "dist-two/$(basename "$file")"
          done
      - run: twine check dist-one/*
      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          set -euo pipefail
          python -I -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -I -m pip install --no-deps dist-one/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/patchlab" --version
          "$RUNNER_TEMP/wheel-env/bin/patchlab" schema --kind passport --output passport.schema.json
      - name: Install and smoke-test the source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -I -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -I -m pip install setuptools==83.0.0
          "$RUNNER_TEMP/sdist-env/bin/python" -I -m pip install --no-deps --no-build-isolation dist-one/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-env/bin/patchlab" --version
      - name: Generate deterministic SBOM
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python scripts/generate_sbom.py --output dist-one/patchlab-commons.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist-one/
          if-no-files-found: error
          retention-days: 14

  demos:
    name: Positive and blocked Patch Passports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -I -m pip install --no-deps -e .
      - run: python -I scripts/run_demo.py --output .patchlab/demo
      - run: patchlab verify-passport .patchlab/demo/patchlab-passport.tar.gz
      - run: python -I scripts/run_attack_demo.py --output .patchlab/blocked-demo
      - run: patchlab verify-passport .patchlab/blocked-demo/patchlab-passport.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patchlab-demo-passports
          path: |
            .patchlab/demo/
            .patchlab/blocked-demo/
          if-no-files-found: error
          retention-days: 14

  action-e2e:
    name: Composite action resists Python module hijacking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted-action
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Create hostile consumer repository
        id: fixture
        run: python -I trusted-action/scripts/prepare_action_e2e.py --repository consumer
      - name: Prepend hostile workspace tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir hostile-tools
          for tool in python git docker podman; do
            cat > "hostile-tools/$tool" <<'EOF'
          #!/bin/sh
          printf 'hijacked\n' > "$GITHUB_WORKSPACE/TOOL-HIJACKED"
          exit 97
          EOF
            chmod 755 "hostile-tools/$tool"
          done
          echo "$GITHUB_WORKSPACE/hostile-tools" >> "$GITHUB_PATH"
      - name: Run the separately checked-out action
        id: patchlab
        uses: ./trusted-action
        with:
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.head }}
          repository: consumer
          config: patchlab.toml
          config-source: base
          execution-mode: static
          fail-on-review: "false"
          output: .patchlab/action-e2e
      - name: Install the trusted verifier after bootstrap
        shell: bash
        run: |
          "$pythonLocation/bin/python" -I -m pip install --no-deps ./trusted-action
      - name: Confirm bootstrap was not hijacked
        shell: bash
        run: |
          test "${{ steps.patchlab.outputs.outcome }}" = "pass"
          test ! -e BOOTSTRAP-HIJACKED
          test ! -e trusted-action/BOOTSTRAP-HIJACKED
          test ! -e consumer/BOOTSTRAP-HIJACKED
          test ! -e TOOL-HIJACKED
          patchlab verify-passport "${{ steps.patchlab.outputs.bundle }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-e2e-passport
          path: consumer/.patchlab/action-e2e/
          if-no-files-found: error
          retention-days: 14

  container-e2e:
    name: Real Linux container isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -I -m pip install --no-deps -e .
      - name: Pull the immutable container test image
        env:
          PATCHLAB_TEST_IMAGE: python:3.14-slim@sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6
        run: docker pull "$PATCHLAB_TEST_IMAGE"
      - name: Run isolation checks
        env:
          PATCHLAB_TEST_IMAGE: python:3.14-slim@sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6
        shell: bash
        run: |
          set -euo pipefail
          canary="$RUNNER_TEMP/patchlab-host-canary"
          printf 'host-only\n' > "$canary"
          python -I scripts/run_container_e2e.py \
            --runtime "$(command -v docker)" \
            --image "$PATCHLAB_TEST_IMAGE" \
            --host-canary "$canary"

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [test, quality, coverage, package, demos, action-e2e, container-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python - <<'PYCODE'
          import json
          import os
          import sys
          results = json.loads(os.environ["RESULTS"])
          failed = {name: data["result"] for name, data in results.items() if data["result"] != "success"}
          if failed:
              print(f"required jobs did not pass: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("all required CI jobs passed")
          PYCODE
