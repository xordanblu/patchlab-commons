name: PatchLab Passport
description: Create an evidence-first Patch Passport without trusting the caller workspace during bootstrap.
author: PatchLab Commons

branding:
  icon: shield
  color: purple

inputs:
  base:
    description: Base Git ref or commit SHA.
    required: true
  head:
    description: Candidate Git ref or commit SHA.
    required: true
  repository:
    description: Repository directory inside GITHUB_WORKSPACE.
    required: false
    default: .
  config:
    description: Path to patchlab.toml, relative to the repository.
    required: false
    default: patchlab.toml
  config-source:
    description: Trusted revision for patchlab.toml. Use base for pull requests.
    required: false
    default: base
  output:
    description: Directory for reports and the passport bundle.
    required: false
    default: .patchlab/out
  fail-on-review:
    description: Fail when a policy requires human review.
    required: false
    default: "true"
  execution-mode:
    description: static, auto, or container. Static never executes project code.
    required: false
    default: static
  container-runtime:
    description: auto, docker, or podman.
    required: false
    default: auto
  container-image:
    description: Digest-pinned image used for isolated command execution.
    required: false
    default: ""
  network:
    description: Allow network access inside the isolated container.
    required: false
    default: "false"

outputs:
  outcome:
    description: pass, needs_review, or fail.
    value: ${{ steps.verify.outputs.outcome }}
  report:
    description: Path to report.json.
    value: ${{ steps.verify.outputs.report }}
  markdown:
    description: Path to report.md.
    value: ${{ steps.verify.outputs.markdown }}
  sarif:
    description: Path to results.sarif.
    value: ${{ steps.verify.outputs.sarif }}
  passport:
    description: Path to passport.json.
    value: ${{ steps.verify.outputs.passport }}
  bundle:
    description: Path to patchlab-passport.tar.gz.
    value: ${{ steps.verify.outputs.bundle }}
  bundle-sha256:
    description: SHA-256 digest of the passport bundle.
    value: ${{ steps.verify.outputs.bundle_sha256 }}
  sidecar:
    description: Path to patchlab-passport.tar.gz.sha256.
    value: ${{ steps.verify.outputs.sidecar }}
  exit-code:
    description: PatchLab process exit code.
    value: ${{ steps.verify.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Create and verify Patch Passport
      id: verify
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PATCHLAB_BASE: ${{ inputs.base }}
        PATCHLAB_HEAD: ${{ inputs.head }}
        PATCHLAB_REPOSITORY: ${{ inputs.repository }}
        PATCHLAB_CONFIG: ${{ inputs.config }}
        PATCHLAB_OUTPUT: ${{ inputs.output }}
        PATCHLAB_CONFIG_SOURCE: ${{ inputs.config-source }}
        PATCHLAB_FAIL_ON_REVIEW: ${{ inputs.fail-on-review }}
        PATCHLAB_EXECUTION_MODE: ${{ inputs.execution-mode }}
        PATCHLAB_CONTAINER_RUNTIME: ${{ inputs.container-runtime }}
        PATCHLAB_CONTAINER_IMAGE: ${{ inputs.container-image }}
        PATCHLAB_NETWORK: ${{ inputs.network }}
        PYTHONPATH: ""
        PYTHONHOME: ""
        PYTHONSTARTUP: ""
        PYTHONUSERBASE: ""
      run: |
        set -euo pipefail
        : "${pythonLocation:?PatchLab requires actions/setup-python before this action}"
        python_root="$pythonLocation"
        workspace_root="$GITHUB_WORKSPACE"
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          python_root="${python_root//\\//}"
          workspace_root="${workspace_root//\\//}"
          python_executable="$python_root/python.exe"
        else
          python_executable="$python_root/bin/python"
        fi
        case "$python_executable" in
          "$workspace_root"/*)
            echo "PatchLab refuses Python from GITHUB_WORKSPACE" >&2
            exit 1
            ;;
        esac
        test -x "$python_executable"
        "$python_executable" -I -S scripts/action_entry.py
